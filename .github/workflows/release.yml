# Yat Yat release pipeline (SPEC8 §2 + SPEC10): tag push (v*) or manual
# dispatch → full validate gate + version check (macOS) + windows test job →
# macOS dmg + Windows NSIS builds → one draft GitHub Release with exactly
# seven assets (dmg, setup.exe, both updater artifacts + sigs, latest.json,
# SHA256SUMS.txt). Nothing auto-publishes; a human smoke-tests the draft and
# flips it live (see docs/RELEASING.md).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to dry-run (e.g. 0.2.0-alpha.2); produces a draft prerelease'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # I1's one-time Whisper-tiny download is the harness's only sanctioned
      # network; cache it so reruns stay offline and quick.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yatyat-validate
          key: yatyat-validate-model-v1
      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Version check (no silent drift)
        run: |
          v="${{ steps.version.outputs.version }}"
          fail=0
          for f in package.json src-tauri/tauri.conf.json; do
            got=$(node -p "JSON.parse(require('fs').readFileSync('$f','utf8')).version")
            if [ "$got" != "$v" ]; then echo "::error::$f has $got, releasing $v"; fail=1; fi
          done
          got=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$got" != "$v" ]; then echo "::error::src-tauri/Cargo.toml has $got, releasing $v"; fail=1; fi
          exit $fail
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run validate
      # Playwright traces for any e2e failure — CI-only flakes are
      # undiagnosable without them.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-traces
          path: test-results/
          if-no-files-found: ignore

  # SPEC10: the cross-platform half of the suite proven on Windows itself
  # (the full validate gate — Playwright e2e + I-suite — stays on macOS).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Vulkan SDK (whisper.cpp vulkan backend)
        shell: pwsh
        run: |
          $ver = "1.3.296.0"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile vulkan-sdk.exe
          Start-Process .\vulkan-sdk.exe -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      # ggml-vulkan's shader-gen ExternalProject rules break under CMake's
      # MSBuild generator (case-insensitive path dedup -> "cannot be built in
      # parallel"); Ninja + the MSVC dev env is the known-good combination.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build native deps with Ninja
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - run: npx vitest run
      - run: npm run build

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Apple Silicon only for the alpha (SPEC8 §2.2) — the universal/Intel
      # build of the ONNX + whisper.cpp stack is a documented seam.
      # SPEC9: signing env makes tauri emit the updater artifacts
      # (.app.tar.gz + .sig) alongside the dmg.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-updater
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Vulkan SDK (whisper.cpp vulkan backend)
        shell: pwsh
        run: |
          $ver = "1.3.296.0"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile vulkan-sdk.exe
          Start-Process .\vulkan-sdk.exe -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      # ggml-vulkan's shader-gen ExternalProject rules break under CMake's
      # MSBuild generator (case-insensitive path dedup -> "cannot be built in
      # parallel"); Ninja + the MSVC dev env is the known-good combination.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build native deps with Ninja
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - run: npm ci
      # SPEC10: NSIS x64 installer; with the signing env tauri also emits the
      # .sig updater artifact for the installer itself.
      - run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, test-windows, build-macos, build-windows]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Asset guard (dmg + setup.exe + updater artifacts, none over 80 MB)
        run: |
          cd release-assets
          ls -l
          [ "$(ls *.dmg 2>/dev/null | wc -l)" -eq 1 ] || { echo "::error::expected exactly one dmg"; exit 1; }
          [ "$(ls *.app.tar.gz 2>/dev/null | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .app.tar.gz"; exit 1; }
          [ "$(ls *.app.tar.gz.sig 2>/dev/null | wc -l)" -eq 1 ] || { echo "::error::expected exactly one .app.tar.gz.sig"; exit 1; }
          [ "$(ls *-setup.exe 2>/dev/null | wc -l)" -eq 1 ] || { echo "::error::expected exactly one -setup.exe"; exit 1; }
          [ "$(ls *-setup.exe.sig 2>/dev/null | wc -l)" -eq 1 ] || { echo "::error::expected exactly one -setup.exe.sig"; exit 1; }
          for f in *; do
            size=$(wc -c < "$f")
            if [ "$size" -gt 83886080 ]; then echo "::error::$f is $size bytes (> 80 MB)"; exit 1; fi
          done
      - name: Checksums
        run: |
          cd release-assets
          # SPEC9: version the updater bundle so per-release URLs are stable.
          [ -e "Yat Yat.app.tar.gz" ] && mv "Yat Yat.app.tar.gz" "Yat Yat_${VERSION}_aarch64.app.tar.gz"
          [ -e "Yat Yat.app.tar.gz.sig" ] && mv "Yat Yat.app.tar.gz.sig" "Yat Yat_${VERSION}_aarch64.app.tar.gz.sig"
          # GitHub rewrites spaces in asset filenames to dots on upload; rename
          # first so SHA256SUMS.txt matches what users actually download.
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Updater manifest (SPEC9 + SPEC10)
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          node scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --notes "Yat Yat $VERSION — see the release page for details." \
            --mac-url "$BASE/Yat.Yat_${VERSION}_aarch64.app.tar.gz" \
            --mac-sig-file "release-assets/Yat.Yat_${VERSION}_aarch64.app.tar.gz.sig" \
            --win-url "$BASE/Yat.Yat_${VERSION}_x64-setup.exe" \
            --win-sig-file "release-assets/Yat.Yat_${VERSION}_x64-setup.exe.sig" \
            --out release-assets/latest.json
          cat release-assets/latest.json
      - name: Release notes header
        run: |
          cat > NOTES.md <<'EOF'
          **Alpha preview — unsigned builds, expect rough edges.**

          | Asset | What it is |
          | --- | --- |
          | `Yat.Yat_*_aarch64.dmg` | macOS app (Apple Silicon). Unsigned — Gatekeeper blocks the first open ("could not verify" or even "damaged"; the file is fine). Fix: `xattr -dr com.apple.quarantine "/Applications/Yat Yat.app"`, or System Settings → Privacy & Security → **Open Anyway** where offered. |
          | `Yat.Yat_*_x64-setup.exe` | Windows installer (x64). Unsigned: SmartScreen → **More info** → **Run anyway**. |
          | `Yat.Yat_*_aarch64.app.tar.gz` (+ `.sig`), `*-setup.exe.sig` | Consumed by **Check for Updates…** inside the app — not for manual installs. |
          | `latest.json` | The updater manifest for this version. |
          | `SHA256SUMS.txt` | Checksums for the assets above. |

          First run walks you through the microphone and Accessibility
          permissions. **Updating from a previous alpha:** unsigned builds
          re-key the Accessibility grant — the app will ask you to re-grant
          it and walks you through the fix.
          EOF
      - name: Create draft release
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "Yat Yat $VERSION" --notes-file NOTES.md \
              release-assets/*.dmg release-assets/*.app.tar.gz release-assets/*.app.tar.gz.sig \
              release-assets/*-setup.exe release-assets/*-setup.exe.sig \
              release-assets/latest.json release-assets/SHA256SUMS.txt
          else
            gh release create "v$VERSION" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Yat Yat $VERSION" --notes-file NOTES.md \
              release-assets/*.dmg release-assets/*.app.tar.gz release-assets/*.app.tar.gz.sig \
              release-assets/*-setup.exe release-assets/*-setup.exe.sig \
              release-assets/latest.json release-assets/SHA256SUMS.txt
          fi
