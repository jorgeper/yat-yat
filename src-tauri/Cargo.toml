[package]
name = "yat-yat"
version = "0.1.0-alpha.2"
description = "Yat Yat — fast, fully-local voice dictation"
authors = ["jorgeper"]
license = "MIT"
edition = "2021"
default-run = "yat-yat"

[lib]
name = "yatyat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# SPEC9: Check for Updates — the ecosystem-standard updater pair.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
cpal = "0.16"
rubato = "0.16"
hound = "3.5"
arboard = "3"
enigo = "0.6"
handy-keys = "0.3"
# Fronts both engine families in-process (SPEC §2): ONNX (Parakeet) and
# whisper.cpp GGUF (Metal on macOS).
transcribe-rs = { version = "=0.3.11", features = ["onnx", "whisper-cpp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Pinned to an exact revision (not a movable branch) so a compromised or
# force-pushed upstream can never silently change what we build.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
tauri-plugin-macos-permissions = "2"
objc2 = "0.6"
objc2-foundation = "0.3"
transcribe-rs = { version = "=0.3.11", features = ["onnx", "whisper-cpp", "whisper-metal"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
